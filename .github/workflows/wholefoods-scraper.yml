name: Whole Foods Scraper Pipeline

on:
  schedule:
    - cron: '0 0 20 * *'  # 20th of every month at 00:00 UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  # ---------------------------------------------------------------------------
  # Scrape + parse on GitHub Actions runner
  # Whole Foods does not use Akamai — GHA IPs are not blocked.
  # ---------------------------------------------------------------------------
  scrape:
    name: Scrape Whole Foods
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install Node dependencies
        working-directory: scripts
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: scripts
        run: npx playwright install chromium --with-deps

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > /home/runner/.ssh/meal-gen-key.pem
          chmod 600 /home/runner/.ssh/meal-gen-key.pem

      - name: Step 1 — Scrape Whole Foods
        working-directory: scripts
        run: |
          node wholefoods/scrape_wholefoods.js \
            --output wholefoods/wholefoods-items.json \
            --meta   wholefoods/wholefoods-metadata.json

      - name: Step 2 — Parse nutrition
        working-directory: scripts/wholefoods
        run: python3 parse_nutrition.py wholefoods-items.json wholefoods-nutrition-parsed.json

      - name: Step 3 — Parse ingredients
        working-directory: scripts/wholefoods
        run: python3 parse_ingredients.py wholefoods-items.json wholefoods-ingredients-parsed.json

      - name: Step 4 — Upload to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          scp -i /home/runner/.ssh/meal-gen-key.pem \
            -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            scripts/wholefoods/wholefoods-items.json \
            scripts/wholefoods/wholefoods-metadata.json \
            scripts/wholefoods/wholefoods-nutrition-parsed.json \
            scripts/wholefoods/wholefoods-ingredients-parsed.json \
            scripts/wholefoods/import_wholefoods.py \
            ec2-user@${EC2_HOST}:/tmp/

      - name: Upload scraped data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wholefoods-items-${{ github.run_id }}
          path: |
            scripts/wholefoods/wholefoods-items.json
            scripts/wholefoods/wholefoods-metadata.json
            scripts/wholefoods/wholefoods-nutrition-parsed.json
            scripts/wholefoods/wholefoods-ingredients-parsed.json
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Import into RDS and backfill embeddings — runs on EC2 via SSH
  # (EC2 has VPC access to RDS; scraping already done on GHA runner)
  # ---------------------------------------------------------------------------
  import-and-embed:
    name: Import & Backfill Embeddings
    runs-on: ubuntu-latest
    needs: scrape

    steps:
      - name: Import items and backfill embeddings on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -euo pipefail

            echo "[WF-PIPELINE] === Starting import + embed backfill ==="

            # Source secrets and config from .env
            ENV_FILE="/opt/meal-gen/.env"
            [[ -f "$ENV_FILE" ]] || { echo "ERROR: .env not found"; exit 1; }
            set -a
            source "$ENV_FILE"
            set +a

            # Derive PG connection vars from Spring datasource URL
            if [[ -z "${PGHOST:-}" ]] && [[ -n "${SPRING_DATASOURCE_URL:-}" ]]; then
              PGHOST=$(echo "$SPRING_DATASOURCE_URL" | sed -E 's|jdbc:postgresql://([^:/]+).*|\1|')
              PGPORT=$(echo "$SPRING_DATASOURCE_URL" | sed -E 's|.*:([0-9]+)/.*|\1|')
              PGDATABASE=$(echo "$SPRING_DATASOURCE_URL" | sed -E 's|.*/([^?]+).*|\1|')
              export PGHOST PGPORT PGDATABASE
            fi

            if [[ -z "${PGPASSWORD:-}" ]] && [[ -n "${SPRING_DATASOURCE_PASSWORD:-}" ]]; then
              PGPASSWORD="$SPRING_DATASOURCE_PASSWORD"
              export PGPASSWORD
            fi

            PGUSER="${PGUSER:-meal_user}"
            PGPORT="${PGPORT:-5432}"
            PGDATABASE="${PGDATABASE:-mealgen}"
            export PGUSER PGPORT PGDATABASE

            [[ -n "${PGHOST:-}"            ]] || { echo "ERROR: PGHOST not set"; exit 1; }
            [[ -n "${PGPASSWORD:-}"        ]] || { echo "ERROR: PGPASSWORD not set"; exit 1; }
            [[ -n "${RAG_SHARED_SECRET:-}" ]] || { echo "ERROR: RAG_SHARED_SECRET not set"; exit 1; }

            echo "[WF-PIPELINE] DB host: ${PGHOST}"

            # Verify the scraped file arrived
            ITEMS_FILE="/tmp/wholefoods-items.json"
            [[ -f "$ITEMS_FILE" ]] || { echo "ERROR: $ITEMS_FILE not found on EC2"; exit 1; }
            ITEM_COUNT=$(python3 -c "import json; print(len(json.load(open('${ITEMS_FILE}'))))")
            echo "[WF-PIPELINE] Item count in file: ${ITEM_COUNT}"
            [[ "$ITEM_COUNT" -ge 500 ]] || { echo "ERROR: Too few items (${ITEM_COUNT})"; exit 1; }

            # Activate Python venv (has psycopg2)
            VENV_DIR="/opt/meal-gen/.venv"
            [[ -f "${VENV_DIR}/bin/activate" ]] && source "${VENV_DIR}/bin/activate"

            # Step 5: Import items into RDS
            echo "[WF-PIPELINE] === Step 5: Import items into database ==="
            WF_JSON_PATH="$ITEMS_FILE" \
              WF_NUTRITION_PARSED="/tmp/wholefoods-nutrition-parsed.json" \
              WF_INGREDIENTS_PARSED="/tmp/wholefoods-ingredients-parsed.json" \
              python3 /tmp/import_wholefoods.py
            echo "[WF-PIPELINE] Database import complete"

            # Step 6: Backfill embeddings via RAG container
            echo "[WF-PIPELINE] === Step 6: Backfill embeddings ==="
            RAG_CONTAINER="python-rag"

            for EMBED_TYPE in items nutrition ingredients; do
              echo "[WF-PIPELINE] Backfilling ${EMBED_TYPE} embeddings..."
              UPDATED=1
              BATCH=0
              while [[ "$UPDATED" -gt 0 ]]; do
                RESPONSE=$(docker exec \
                  -e _RAG_SECRET="${RAG_SHARED_SECRET}" \
                  -e _EMBED_TYPE="${EMBED_TYPE}" \
                  "$RAG_CONTAINER" \
                  python3 -c "import urllib.request,os,json; etype=os.environ['_EMBED_TYPE']; req=urllib.request.Request('http://localhost:8000/embed/backfill/'+etype,data=json.dumps({'limit':200}).encode(),headers={'Content-Type':'application/json','X-RAG-SECRET':os.environ['_RAG_SECRET']},method='POST'); print(urllib.request.urlopen(req).read().decode())") || {
                  echo "[WF-PIPELINE] WARNING: embed backfill request failed for ${EMBED_TYPE}, skipping"
                  break
                }
                UPDATED=$(echo "$RESPONSE" | python3 -c \
                  "import sys,json; d=json.loads(sys.stdin.read()); print(d.get('updated',0))" 2>/dev/null || echo 0)
                BATCH=$((BATCH + 1))
                echo "[WF-PIPELINE]   ${EMBED_TYPE}: batch=${BATCH} updated=${UPDATED}"
              done
              echo "[WF-PIPELINE] ${EMBED_TYPE} embeddings complete (${BATCH} batches)"
            done

            # Cleanup
            rm -f /tmp/wholefoods-items.json /tmp/wholefoods-metadata.json \
                  /tmp/wholefoods-nutrition-parsed.json /tmp/wholefoods-ingredients-parsed.json \
                  /tmp/import_wholefoods.py
            echo "[WF-PIPELINE] === Pipeline Complete ==="
