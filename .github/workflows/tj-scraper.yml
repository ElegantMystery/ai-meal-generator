name: TJ Scraper Pipeline

on:
  schedule:
    - cron: '0 0 1 * *'  # First day of every month at 00:00 UTC
  workflow_dispatch:       # Allow manual trigger

env:
  AWS_REGION: us-east-1

jobs:
  # ---------------------------------------------------------------------------
  # Scrape on GitHub Actions runner (rotating IPs — not blocked by Trader Joe's)
  # ---------------------------------------------------------------------------
  scrape:
    name: Scrape Trader Joe's
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: scripts
        run: npx playwright install chromium --with-deps

      # Reach EC2 through SSM Session Manager (no inbound :22). See deploy.yml.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install session-manager-plugin
        run: |
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/1.2.835.0/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/smp.deb
          echo "7c6dcad12518571cc7959a713e6a8ae1bdf6ed66fd9bee37dc189e39ca58ae03  /tmp/smp.deb" | sha256sum -c -
          sudo dpkg -i /tmp/smp.deb

      - name: Write SSH key + resolve instance
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > /home/runner/.ssh/meal-gen-key.pem
          chmod 600 /home/runner/.ssh/meal-gen-key.pem
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=meal-gen-prod-app" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Could not resolve prod instance ID"; exit 1
          fi
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"

      - name: Run pipeline (scrape + upload to EC2 over SSM)
        env:
          EC2_INSTANCE_ID: ${{ env.INSTANCE_ID }}
          EC2_USER: ec2-user
          EC2_KEY: /home/runner/.ssh/meal-gen-key.pem
          EC2_DEST: /tmp
          AWS_REGION: ${{ env.AWS_REGION }}
        run: bash scripts/tj/run_pipeline.sh

      - name: Upload scraped data as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tj-items-${{ github.run_id }}
          path: |
            scripts/tj/tj-items.json
            scripts/tj/tj-metadata.json
            scripts/tj/tj-nutrition-parsed.json
            scripts/tj/tj-ingredients-parsed.json
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Import into RDS and backfill embeddings — runs on EC2 via SSH-over-SSM
  # (EC2 has VPC access to RDS; scraping already done on GHA runner)
  # ---------------------------------------------------------------------------
  import-and-embed:
    name: Import & Backfill Embeddings
    runs-on: ubuntu-24.04
    needs: scrape

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install session-manager-plugin
        run: |
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/1.2.835.0/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/smp.deb
          echo "7c6dcad12518571cc7959a713e6a8ae1bdf6ed66fd9bee37dc189e39ca58ae03  /tmp/smp.deb" | sha256sum -c -
          sudo dpkg -i /tmp/smp.deb

      - name: Resolve instance + configure SSH-over-SSM
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=meal-gen-prod-app" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Could not resolve prod instance ID"; exit 1
          fi
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          cat > ~/.ssh/config <<EOF
          Host $INSTANCE_ID
            User ec2-user
            IdentityFile ~/.ssh/ec2_key
            StrictHostKeyChecking accept-new
            ServerAliveInterval 60
            ProxyCommand sh -c "aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters 'portNumber=%p' --region ${{ env.AWS_REGION }}"
          EOF

      - name: Import items and backfill embeddings on EC2
        run: |
          ssh "$INSTANCE_ID" 'bash -s' <<'SCRIPT'
            set -euo pipefail

            echo "[TJ-PIPELINE] === Starting import + embed backfill ==="

            # Source secrets and config from .env
            ENV_FILE="/opt/meal-gen/.env"
            [[ -f "$ENV_FILE" ]] || { echo "ERROR: .env not found"; exit 1; }
            set -a
            source "$ENV_FILE"
            set +a

            # Derive PG connection vars from Spring datasource URL
            if [[ -z "${PGHOST:-}" ]] && [[ -n "${SPRING_DATASOURCE_URL:-}" ]]; then
              PGHOST=$(echo "$SPRING_DATASOURCE_URL" | sed -E 's|jdbc:postgresql://([^:/]+).*|\1|')
              PGPORT=$(echo "$SPRING_DATASOURCE_URL" | sed -E 's|.*:([0-9]+)/.*|\1|')
              PGDATABASE=$(echo "$SPRING_DATASOURCE_URL" | sed -E 's|.*/([^?]+).*|\1|')
              export PGHOST PGPORT PGDATABASE
            fi

            if [[ -z "${PGPASSWORD:-}" ]] && [[ -n "${SPRING_DATASOURCE_PASSWORD:-}" ]]; then
              PGPASSWORD="$SPRING_DATASOURCE_PASSWORD"
              export PGPASSWORD
            fi

            PGUSER="${PGUSER:-meal_user}"
            PGPORT="${PGPORT:-5432}"
            PGDATABASE="${PGDATABASE:-mealgen}"
            export PGUSER PGPORT PGDATABASE

            [[ -n "${PGHOST:-}"         ]] || { echo "ERROR: PGHOST not set"; exit 1; }
            [[ -n "${PGPASSWORD:-}"     ]] || { echo "ERROR: PGPASSWORD not set"; exit 1; }
            [[ -n "${RAG_SHARED_SECRET:-}" ]] || { echo "ERROR: RAG_SHARED_SECRET not set"; exit 1; }

            echo "[TJ-PIPELINE] DB host: ${PGHOST}"

            # Verify the scraped file arrived
            ITEMS_FILE="/tmp/tj-items.json"
            [[ -f "$ITEMS_FILE" ]] || { echo "ERROR: $ITEMS_FILE not found on EC2"; exit 1; }
            ITEM_COUNT=$(python3 -c "import json; print(len(json.load(open('${ITEMS_FILE}'))))")
            echo "[TJ-PIPELINE] Item count in file: ${ITEM_COUNT}"
            [[ "$ITEM_COUNT" -ge 100 ]] || { echo "ERROR: Too few items (${ITEM_COUNT})"; exit 1; }

            # Activate Python venv (has psycopg2)
            VENV_DIR="/opt/meal-gen/.venv"
            [[ -f "${VENV_DIR}/bin/activate" ]] && source "${VENV_DIR}/bin/activate"

            # Step 1: Import items into RDS
            echo "[TJ-PIPELINE] === Step 1: Import items into database ==="
            TJ_JSON_PATH="$ITEMS_FILE" \
              TJ_NUTRITION_PARSED_PATH="/tmp/tj-nutrition-parsed.json" \
              TJ_INGREDIENTS_PARSED_PATH="/tmp/tj-ingredients-parsed.json" \
              python3 /opt/meal-gen/scripts/tj/import_tj.py
            echo "[TJ-PIPELINE] Database import complete"

            # Step 2: Backfill embeddings via RAG container
            echo "[TJ-PIPELINE] === Step 2: Backfill embeddings ==="
            RAG_CONTAINER="python-rag"

            for EMBED_TYPE in items nutrition ingredients; do
              echo "[TJ-PIPELINE] Backfilling ${EMBED_TYPE} embeddings..."
              UPDATED=1
              BATCH=0
              while [[ "$UPDATED" -gt 0 ]]; do
                # Pass secret via -e so it doesn't appear in the process listing.
                # Use bash -c with single quotes so $_ vars are expanded inside the container.
                RESPONSE=$(docker exec \
                  -e _RAG_SECRET="${RAG_SHARED_SECRET}" \
                  -e _EMBED_TYPE="${EMBED_TYPE}" \
                  "$RAG_CONTAINER" \
                  python3 -c "import urllib.request,os,json; etype=os.environ['_EMBED_TYPE']; req=urllib.request.Request('http://localhost:8000/embed/backfill/'+etype,data=json.dumps({'limit':200}).encode(),headers={'Content-Type':'application/json','X-RAG-SECRET':os.environ['_RAG_SECRET']},method='POST'); print(urllib.request.urlopen(req).read().decode())") || {
                  echo "[TJ-PIPELINE] WARNING: embed backfill request failed for ${EMBED_TYPE}, skipping"
                  break
                }
                UPDATED=$(echo "$RESPONSE" | python3 -c \
                  "import sys,json; d=json.loads(sys.stdin.read()); print(d.get('updated',0))" 2>/dev/null || echo 0)
                BATCH=$((BATCH + 1))
                echo "[TJ-PIPELINE]   ${EMBED_TYPE}: batch=${BATCH} updated=${UPDATED}"
              done
              echo "[TJ-PIPELINE] ${EMBED_TYPE} embeddings complete (${BATCH} batches)"
            done

            # Cleanup
            rm -f "$ITEMS_FILE" /tmp/tj-metadata.json /tmp/tj-nutrition-parsed.json /tmp/tj-ingredients-parsed.json
            echo "[TJ-PIPELINE] === Pipeline Complete ==="
          SCRIPT
