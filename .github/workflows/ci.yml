name: Pull Request CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository Policy & Documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install documentation check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
      - name: Test pull-request CI contract
        run: python3 scripts/test_pr_ci_workflow.py
      - name: Verify immutable CI references
        run: bash scripts/check_immutable_ci_refs.sh
      - name: Test documentation check diagnostics
        run: python3 scripts/test_documentation_drift.py
      - name: Verify documentation contract
        run: bash scripts/check_documentation_drift.sh

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        working-directory: backend
        run: ./mvnw --batch-mode test

  flyway-validation:
    name: Flyway Fresh-Database Validation
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_DB: mealgen
          POSTGRES_USER: meal_user
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meal_user -d mealgen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Migrate fresh pgvector database
        working-directory: backend
        env:
          DB_PASSWORD: test-password
        run: ./mvnw --batch-mode flyway:migrate
      - name: Validate migration history
        working-directory: backend
        env:
          DB_PASSWORD: test-password
        run: ./mvnw --batch-mode flyway:validate

  frontend-quality:
    name: Frontend Tests, Lint & Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --runInBand
      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        run: npm run build

  rag-quality:
    name: RAG Tests & Dependency Integrity
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            rag/requirements.txt
            rag/requirements-test.txt
      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r rag/requirements-test.txt
      - name: Run RAG tests
        env:
          RAG_ENV: test
          RAG_SHARED_SECRET: test-secret
          OPENAI_API_KEY: test-key
          MINIMAX_API_KEY: test-key
        run: python -m pytest rag/tests -q
      - name: Audit Python dependencies
        run: pip-audit -r rag/requirements.txt
      - name: Verify Python lock files are current
        working-directory: rag
        run: |
          pip-compile --generate-hashes --strip-extras --resolver=backtracking --output-file=requirements.txt requirements.in
          pip-compile --allow-unsafe --generate-hashes --strip-extras --resolver=backtracking --output-file=requirements-test.txt requirements-test.in
          git diff --exit-code -- requirements.txt requirements-test.txt
      - name: Verify reproducible RAG image dependencies
        run: bash scripts/check_rag_image_reproducibility.sh
      - name: Test production deployment control flow
        run: bash scripts/deploy/test_deploy_prod.sh
