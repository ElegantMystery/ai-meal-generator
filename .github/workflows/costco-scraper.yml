name: Costco Scraper Pipeline

on:
  schedule:
    - cron: '0 0 15 * *'  # 15th of every month at 00:00 UTC (offset from TJ's 1st)
  workflow_dispatch:        # Allow manual trigger

jobs:
  # ---------------------------------------------------------------------------
  # Scrape on GitHub Actions runner.
  # NOTE: If Akamai blocks GHA IPs (same vendor as Trader Joe's), run manually:
  #   cd scripts/costco && bash run_pipeline.sh
  # ---------------------------------------------------------------------------
  scrape:
    name: Scrape Costco
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: scripts
        run: npx playwright install chromium --with-deps

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install psycopg2-binary

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > /home/runner/.ssh/meal-gen-key.pem
          chmod 600 /home/runner/.ssh/meal-gen-key.pem

      - name: Run pipeline (scrape + parse + upload to EC2)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ec2-user
          EC2_KEY: /home/runner/.ssh/meal-gen-key.pem
          EC2_DEST: /tmp
        run: bash scripts/costco/run_pipeline.sh

      - name: Upload scraped data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: costco-items-${{ github.run_id }}
          path: |
            scripts/costco/costco-items.json
            scripts/costco/costco-metadata.json
            scripts/costco/costco-nutrition-parsed.json
            scripts/costco/costco-ingredients-parsed.json
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Import into RDS and backfill embeddings — runs on EC2 via SSH
  # ---------------------------------------------------------------------------
  import-and-embed:
    name: Import & Backfill Embeddings
    runs-on: ubuntu-latest
    needs: scrape

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import items and backfill embeddings on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -euo pipefail

            echo "[COSTCO-PIPELINE] === Starting import + embed backfill ==="

            # Source secrets from .env
            ENV_FILE="/opt/meal-gen/.env"
            [[ -f "$ENV_FILE" ]] || { echo "ERROR: .env not found"; exit 1; }
            set -a
            source "$ENV_FILE"
            set +a

            # Derive PG connection vars from Spring datasource URL
            if [[ -z "${PGHOST:-}" ]] && [[ -n "${SPRING_DATASOURCE_URL:-}" ]]; then
              PGHOST=$(echo "$SPRING_DATASOURCE_URL" | sed -E 's|jdbc:postgresql://([^:/]+).*|\1|')
              PGPORT=$(echo "$SPRING_DATASOURCE_URL" | sed -E 's|.*:([0-9]+)/.*|\1|')
              PGDATABASE=$(echo "$SPRING_DATASOURCE_URL" | sed -E 's|.*/([^?]+).*|\1|')
              export PGHOST PGPORT PGDATABASE
            fi

            if [[ -z "${PGPASSWORD:-}" ]] && [[ -n "${SPRING_DATASOURCE_PASSWORD:-}" ]]; then
              PGPASSWORD="$SPRING_DATASOURCE_PASSWORD"
              export PGPASSWORD
            fi

            PGUSER="${PGUSER:-meal_user}"
            PGPORT="${PGPORT:-5432}"
            PGDATABASE="${PGDATABASE:-mealgen}"
            export PGUSER PGPORT PGDATABASE

            [[ -n "${PGHOST:-}"            ]] || { echo "ERROR: PGHOST not set"; exit 1; }
            [[ -n "${PGPASSWORD:-}"        ]] || { echo "ERROR: PGPASSWORD not set"; exit 1; }
            [[ -n "${RAG_SHARED_SECRET:-}" ]] || { echo "ERROR: RAG_SHARED_SECRET not set"; exit 1; }

            echo "[COSTCO-PIPELINE] DB host: ${PGHOST}"

            # Verify scraped file arrived
            ITEMS_FILE="/tmp/costco-items.json"
            [[ -f "$ITEMS_FILE" ]] || { echo "ERROR: $ITEMS_FILE not found on EC2"; exit 1; }
            ITEM_COUNT=$(python3 -c "import json; print(len(json.load(open('${ITEMS_FILE}'))))")
            echo "[COSTCO-PIPELINE] Item count in file: ${ITEM_COUNT}"
            [[ "$ITEM_COUNT" -ge 200 ]] || { echo "ERROR: Too few items (${ITEM_COUNT})"; exit 1; }

            # Activate Python venv (has psycopg2)
            VENV_DIR="/opt/meal-gen/.venv"
            [[ -f "${VENV_DIR}/bin/activate" ]] && source "${VENV_DIR}/bin/activate"

            # Step 1: Import items into RDS
            echo "[COSTCO-PIPELINE] === Step 1: Import items into database ==="
            COSTCO_JSON_PATH="$ITEMS_FILE" \
              COSTCO_NUTRITION_PARSED_PATH="/tmp/costco-nutrition-parsed.json" \
              COSTCO_INGREDIENTS_PARSED_PATH="/tmp/costco-ingredients-parsed.json" \
              python3 /opt/meal-gen/scripts/costco/import_costco.py
            echo "[COSTCO-PIPELINE] Database import complete"

            # Step 2: Backfill embeddings via RAG container
            echo "[COSTCO-PIPELINE] === Step 2: Backfill embeddings ==="
            RAG_CONTAINER="python-rag"

            for EMBED_TYPE in items nutrition ingredients; do
              echo "[COSTCO-PIPELINE] Backfilling ${EMBED_TYPE} embeddings..."
              UPDATED=1
              BATCH=0
              while [[ "$UPDATED" -gt 0 ]]; do
                RESPONSE=$(docker exec \
                  -e _RAG_SECRET="${RAG_SHARED_SECRET}" \
                  -e _EMBED_TYPE="${EMBED_TYPE}" \
                  "$RAG_CONTAINER" \
                  python3 -c "import urllib.request,os,json; etype=os.environ['_EMBED_TYPE']; req=urllib.request.Request('http://localhost:8000/embed/backfill/'+etype,data=json.dumps({'limit':200}).encode(),headers={'Content-Type':'application/json','X-RAG-SECRET':os.environ['_RAG_SECRET']},method='POST'); print(urllib.request.urlopen(req).read().decode())") || {
                  echo "[COSTCO-PIPELINE] WARNING: embed backfill failed for ${EMBED_TYPE}, skipping"
                  break
                }
                UPDATED=$(echo "$RESPONSE" | python3 -c \
                  "import sys,json; d=json.loads(sys.stdin.read()); print(d.get('updated',0))" 2>/dev/null || echo 0)
                BATCH=$((BATCH + 1))
                echo "[COSTCO-PIPELINE]   ${EMBED_TYPE}: batch=${BATCH} updated=${UPDATED}"
              done
              echo "[COSTCO-PIPELINE] ${EMBED_TYPE} embeddings complete (${BATCH} batches)"
            done

            # Cleanup
            rm -f "$ITEMS_FILE" /tmp/costco-metadata.json \
              /tmp/costco-nutrition-parsed.json /tmp/costco-ingredients-parsed.json
            echo "[COSTCO-PIPELINE] === Pipeline Complete ==="
