name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual trigger

env:
  AWS_REGION: us-east-1

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        working-directory: backend
        run: ./mvnw --batch-mode test

  frontend-quality:
    name: Frontend Tests, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --runInBand
      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://whole-haul.com
        run: npm run build

  rag-tests:
    name: RAG Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            rag/requirements.txt
            rag/requirements-test.txt
      - name: Install dependencies
        run: python -m pip install -r rag/requirements-test.txt
      - name: Run RAG tests
        run: python -m pytest rag/tests -q

  # ---------------------------------------------------------------------------
  # Build and push all 3 images to ECR in parallel
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-quality, rag-tests]
    strategy:
      fail-fast: false  # let other builds finish even if one fails
      matrix:
        include:
          - service: frontend
            context: ./frontend
            repo: meal-gen-frontend
          - service: backend
            context: ./backend
            repo: meal-gen-backend
          - service: rag
            context: ./rag
            repo: meal-gen-rag

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # QEMU + Buildx for cross-compiling to linux/arm64 (EC2 t4g is ARM)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.repo }}:${{ github.sha }}
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.repo }}:latest
          # Bake NEXT_PUBLIC_API_BASE_URL into the frontend bundle at build time
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ matrix.service == 'frontend' && 'https://whole-haul.com' || '' }}
          # GHA layer cache — dramatically speeds up rebuilds
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ---------------------------------------------------------------------------
  # Deploy to EC2 once all 3 images are pushed
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Reach EC2 through SSM Session Manager (SSH-over-SSM) instead of a
      # public SSH port. The security group has no inbound :22 rule; the SSM
      # agent dials out to AWS, so connections are tunnelled over that channel.
      - name: Install session-manager-plugin
        run: |
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/smp.deb
          sudo dpkg -i /tmp/smp.deb

      - name: Resolve instance + configure SSH-over-SSM
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=meal-gen-prod-app" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Could not resolve prod instance ID"; exit 1
          fi
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "Resolved instance: $INSTANCE_ID"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          cat > ~/.ssh/config <<EOF
          Host $INSTANCE_ID
            User ec2-user
            IdentityFile ~/.ssh/ec2_key
            StrictHostKeyChecking accept-new
            ProxyCommand sh -c "aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters 'portNumber=%p' --region ${{ env.AWS_REGION }}"
          EOF

      # Copy compose file + nginx config + cloudwatch config + scraper scripts to EC2.
      # Use tar-over-ssh (rsync is not installed on Amazon Linux 2023); relative
      # paths are preserved and extracted under /opt/meal-gen. No clobbering of
      # runtime-only dirs (nginx/certbot certs, nginx-logs) since we only overlay.
      - name: Copy config files to EC2
        run: |
          tar czf - \
            --exclude='scripts/tj/*.json' --exclude='scripts/tj/*.png' \
            docker-compose.prod.yml nginx cloudwatch scripts/tj \
            | ssh "$INSTANCE_ID" 'mkdir -p /opt/meal-gen && tar xzf - -C /opt/meal-gen'

      # SSH in (over SSM), pull new images, rolling restart
      - name: Deploy
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh "$INSTANCE_ID" "ECR_REGISTRY='$ECR_REGISTRY' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'SCRIPT'
            set -euo pipefail
            cd /opt/meal-gen

            echo "==> Logging in to ECR"
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin "$ECR_REGISTRY"

            echo "==> Updating .env"
            # Upsert IMAGE_TAG and ECR_REGISTRY in .env
            update_env() {
              local key=$1 val=$2
              if grep -q "^${key}=" .env 2>/dev/null; then
                sed -i "s|^${key}=.*|${key}=${val}|" .env
              else
                echo "${key}=${val}" >> .env
              fi
            }
            update_env IMAGE_TAG     "$IMAGE_TAG"
            update_env ECR_REGISTRY  "$ECR_REGISTRY"

            echo "==> Pulling new images"
            docker compose -f docker-compose.prod.yml pull

            echo "==> Rolling restart"
            # Restart in dependency order; brief sleeps let healthchecks pass
            docker compose -f docker-compose.prod.yml up -d --no-deps python-rag
            sleep 15
            docker compose -f docker-compose.prod.yml up -d --no-deps backend
            sleep 20
            docker compose -f docker-compose.prod.yml up -d --no-deps frontend
            docker compose -f docker-compose.prod.yml up -d --no-deps nginx
            docker compose -f docker-compose.prod.yml up -d --no-deps certbot

            echo "==> Ensuring nginx-logs directory exists"
            mkdir -p /opt/meal-gen/nginx-logs

            echo "==> Configuring and starting CloudWatch Agent"
            sudo cp /opt/meal-gen/cloudwatch/amazon-cloudwatch-agent.json \
              /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
            sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
              -a fetch-config -m ec2 \
              -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s

            echo "==> Pruning old images"
            docker image prune -f

            echo "==> Deploy complete ($IMAGE_TAG)"
          SCRIPT

  # ---------------------------------------------------------------------------
  # Smoke test — verify the backend health endpoint responds
  # ---------------------------------------------------------------------------
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for services to stabilize
        run: sleep 30

      - name: Check /actuator/health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            "https://whole-haul.com/actuator/health")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed (HTTP $STATUS)"
            exit 1
          fi
          echo "Health check passed"
