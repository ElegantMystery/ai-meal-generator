name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual trigger

env:
  AWS_REGION: us-east-1

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  flyway-validation:
    name: Flyway Fresh-Database Validation
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_DB: mealgen
          POSTGRES_USER: meal_user
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meal_user -d mealgen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Migrate fresh pgvector database
        working-directory: backend
        env:
          DB_PASSWORD: test-password
        run: ./mvnw --batch-mode flyway:migrate
      - name: Validate migration history
        working-directory: backend
        env:
          DB_PASSWORD: test-password
        run: ./mvnw --batch-mode flyway:validate

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify immutable CI references
        run: bash scripts/check_immutable_ci_refs.sh
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        working-directory: backend
        run: ./mvnw --batch-mode test

  frontend-quality:
    name: Frontend Tests, Lint & Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --runInBand
      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://whole-haul.com
        run: npm run build

  rag-tests:
    name: RAG Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            rag/requirements.txt
            rag/requirements-test.txt
      - name: Install dependencies
        run: python -m pip install --require-hashes -r rag/requirements-test.txt
      - name: Audit Python dependencies
        run: pip-audit -r rag/requirements.txt
      - name: Verify Python lock files are current
        working-directory: rag
        run: |
          pip-compile --generate-hashes --strip-extras --resolver=backtracking --output-file=requirements.txt requirements.in
          pip-compile --allow-unsafe --generate-hashes --strip-extras --resolver=backtracking --output-file=requirements-test.txt requirements-test.in
          git diff --exit-code -- requirements.txt requirements-test.txt
      - name: Run RAG tests
        env:
          RAG_ENV: test
          RAG_SHARED_SECRET: test-secret
          OPENAI_API_KEY: test-key
          MINIMAX_API_KEY: test-key
        run: python -m pytest rag/tests -q
      - name: Verify reproducible RAG image dependencies
        run: bash scripts/check_rag_image_reproducibility.sh
      - name: Test production deployment control flow
        run: bash scripts/deploy/test_deploy_prod.sh

  # ---------------------------------------------------------------------------
  # Build and push all 3 images to ECR in parallel
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-24.04
    needs: [flyway-validation, backend-tests, frontend-quality, rag-tests]
    strategy:
      fail-fast: false  # let other builds finish even if one fails
      matrix:
        include:
          - service: frontend
            context: ./frontend
            repo: meal-gen-frontend
          - service: backend
            context: ./backend
            repo: meal-gen-backend
          - service: rag
            context: ./rag
            repo: meal-gen-rag

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      # QEMU + Buildx for cross-compiling to linux/arm64 (EC2 t4g is ARM)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.repo }}:${{ github.sha }}
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.repo }}:latest
          # Bake NEXT_PUBLIC_API_BASE_URL into the frontend bundle at build time
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ matrix.service == 'frontend' && 'https://whole-haul.com' || '' }}
          # GHA layer cache — dramatically speeds up rebuilds
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ---------------------------------------------------------------------------
  # Deploy to EC2 once all 3 images are pushed
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Reach EC2 through SSM Session Manager (SSH-over-SSM) instead of a
      # public SSH port. The security group has no inbound :22 rule; the SSM
      # agent dials out to AWS, so connections are tunnelled over that channel.
      - name: Install session-manager-plugin
        run: |
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/1.2.835.0/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/smp.deb
          echo "7c6dcad12518571cc7959a713e6a8ae1bdf6ed66fd9bee37dc189e39ca58ae03  /tmp/smp.deb" | sha256sum -c -
          sudo dpkg -i /tmp/smp.deb

      - name: Resolve instance + configure SSH-over-SSM
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=meal-gen-prod-app" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Could not resolve prod instance ID"; exit 1
          fi
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "Resolved instance: $INSTANCE_ID"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          cat > ~/.ssh/config <<EOF
          Host $INSTANCE_ID
            User ec2-user
            IdentityFile ~/.ssh/ec2_key
            StrictHostKeyChecking accept-new
            ProxyCommand sh -c "aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters 'portNumber=%p' --region ${{ env.AWS_REGION }}"
          EOF

      # Copy compose file + nginx config + cloudwatch config + operational scripts to EC2.
      # Use tar-over-ssh (rsync is not installed on Amazon Linux 2023); relative
      # paths are preserved and extracted under /opt/meal-gen. No clobbering of
      # runtime-only dirs (nginx/certbot certs, nginx-logs) since we only overlay.
      - name: Copy config files to EC2
        run: |
          tar czf - \
            --exclude='scripts/tj/*.json' --exclude='scripts/tj/*.png' \
            docker-compose.prod.yml nginx cloudwatch scripts/tj scripts/deploy \
            | ssh "$INSTANCE_ID" 'mkdir -p /opt/meal-gen && tar xzf - -C /opt/meal-gen'

      # SSH in (over SSM), pull new images, rolling restart
      - name: Deploy
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh "$INSTANCE_ID" "ECR_REGISTRY='$ECR_REGISTRY' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'SCRIPT'
            set -euo pipefail
            cd /opt/meal-gen

            echo "==> Logging in to ECR"
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin "$ECR_REGISTRY"

            echo "==> Validating required service secrets"
            if ! grep -Eq '^RAG_SHARED_SECRET=[^[:space:]].*$' .env; then
              echo "RAG_SHARED_SECRET is missing or blank in /opt/meal-gen/.env"
              exit 1
            fi

            echo "==> Deploying with bounded readiness checks and automatic rollback"
            bash scripts/deploy/deploy_prod.sh "$IMAGE_TAG"

            echo "==> Ensuring nginx-logs directory exists"
            mkdir -p /opt/meal-gen/nginx-logs

            echo "==> Configuring and starting CloudWatch Agent"
            sudo cp /opt/meal-gen/cloudwatch/amazon-cloudwatch-agent.json \
              /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
            sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
              -a fetch-config -m ec2 \
              -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s

            echo "==> Pruning old images"
            docker image prune -f

            echo "==> Deploy complete ($IMAGE_TAG)"
          SCRIPT

  # ---------------------------------------------------------------------------
  # Smoke test — verify the backend health endpoint responds
  # ---------------------------------------------------------------------------
  health-check:
    name: Health Check
    runs-on: ubuntu-24.04
    needs: deploy

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run production smoke tests
        run: bash scripts/deploy/smoke_prod.sh https://whole-haul.com "${{ github.sha }}"
