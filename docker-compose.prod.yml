# Production Docker Compose — uses ECR images + RDS (no local DB container)
#
# Required environment variables (populate /opt/meal-gen/.env on EC2):
#   ECR_REGISTRY       — e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com
#   IMAGE_TAG          — git SHA from CI (e.g. abc1234)
#   DATABASE_URL       — postgresql://user:pass@<RDS_HOST>:5432/mealgen  (RAG)
#   SPRING_DATASOURCE_URL      — jdbc:postgresql://<RDS_HOST>:5432/mealgen
#   SPRING_DATASOURCE_USERNAME — RDS master username
#   SPRING_DATASOURCE_PASSWORD — RDS master password
#   OPENAI_API_KEY     — OpenAI API key
#   RAG_SHARED_SECRET  — shared secret for backend→RAG auth
#   GOOGLE_CLIENT_ID   — Google OAuth2 client ID
#   GOOGLE_CLIENT_SECRET — Google OAuth2 client secret
#   CORS_ALLOWED_ORIGINS — e.g. https://yourdomain.com
#   FRONTEND_URL         — e.g. https://yourdomain.com
#   NEXT_PUBLIC_API_BASE_URL — e.g. https://yourdomain.com
#   STRIPE_SECRET_KEY    — Stripe secret key (sk_live_* for prod)
#   STRIPE_WEBHOOK_SECRET — Stripe webhook signing secret (whsec_*)
#   STRIPE_PRO_PRICE_ID  — Stripe price ID for PRO plan (price_*)

services:
  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: meal-gen-nginx
    ports:
      - "80:80"
      - "443:443"
    # Reload every 6h so renewed certs (written to the shared volume by the
    # certbot container) are picked up — nginx caches certs in memory at start,
    # so without a periodic reload it serves the stale cert until it crashes.
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx-logs:/var/log/nginx   # expose to host for CloudWatch Agent
    restart: always
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Certbot for Let's Encrypt certificate renewal
  # Initial cert: docker compose -f docker-compose.prod.yml run --rm certbot certonly \
  #   --webroot --webroot-path /var/www/certbot -d yourdomain.com
  certbot:
    image: certbot/certbot:latest@sha256:34ee91d2f43008eb78a007d22f23ed4b2eaa9a454cb27ca2c042b49527a695b4
    container_name: meal-gen-certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    # Auto-renew every 12 hours
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"
    restart: always

  python-rag:
    image: ${ECR_REGISTRY}/meal-gen-rag:${IMAGE_TAG:?IMAGE_TAG must be an immutable tag}
    container_name: python-rag
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      RAG_ENV: production
      RAG_SHARED_SECRET: ${RAG_SHARED_SECRET:?RAG_SHARED_SECRET must be set}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.minimax.io/anthropic}
      AGENT_MODEL: ${AGENT_MODEL:-MiniMax-M3}
      AGENT_MAX_TURNS: ${AGENT_MAX_TURNS:-25}
    expose:
      - "8000"
    restart: always
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /meal-gen/prod/rag
        awslogs-stream: rag
        awslogs-create-group: "true"
        mode: non-blocking
        max-buffer-size: 4m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    image: ${ECR_REGISTRY}/meal-gen-backend:${IMAGE_TAG:?IMAGE_TAG must be an immutable tag}
    container_name: mealgen-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      MEALGEN_RAG_BASEURL: http://python-rag:8000
      MEALGEN_RAG_SECRET: ${RAG_SHARED_SECRET:?RAG_SHARED_SECRET must be set}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID}
    expose:
      - "8080"
    restart: always
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /meal-gen/prod/backend
        awslogs-stream: backend
        awslogs-create-group: "true"
        mode: non-blocking
        max-buffer-size: 4m
    depends_on:
      python-rag:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    image: ${ECR_REGISTRY}/meal-gen-frontend:${IMAGE_TAG:?IMAGE_TAG must be an immutable tag}
    container_name: mealgen-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    expose:
      - "3000"
    restart: always
    depends_on:
      backend:
        condition: service_healthy
